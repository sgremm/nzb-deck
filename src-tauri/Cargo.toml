[package]
name = "nzb-deck"
version = "0.1.1"
description = "Native Usenet downloader for macOS and iOS"
authors = ["SGremm"]
edition = "2024"

[lib]
name = "nzb_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
rust-par2 = "0.1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
usenet-dl = { path = "vendor/usenet-dl" }
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[patch.crates-io]
# tao 0.35.3 panickt bei LaunchServices-Dateiöffnung (unwrap auf absoluteString);
# lokaler Patch in vendor/tao behebt das.
tao = { path = "vendor/tao" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time"] }
usenet-dl = { path = "vendor/usenet-dl" }
zip = "0.6"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# strip = true strippt auch Proc-Macro-Dylibs, rustc findet sie dann nicht
# mehr (E0463 "can't find crate for ..._macros").
[profile.release.build-override]
strip = "none"
